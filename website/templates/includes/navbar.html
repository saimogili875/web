{% load static %}
<header class="site-header" role="banner">
  <div class="container">
    <nav class="nav-pill" aria-label="Main Navigation">
      <a href="{% url 'home' %}" aria-label="Arkshar Home" class="nav-logo">
        <img src="{% static 'arkshar-logo.svg' %}" alt="Arkshar" class="brand-logo" width="130" height="38">
      </a>

      <!-- Desktop Navigation Links -->
      <div class="nav-links">
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'websites_apps' %}" class="{% if request.resolver_match.url_name == 'websites_apps' %}active{% endif %}">Websites & Apps</a>
        <a href="{% url 'erp' %}" class="{% if request.resolver_match.url_name == 'erp' %}active{% endif %}">ERP</a>
        <a href="{% url 'ai_marketing' %}" class="{% if request.resolver_match.url_name == 'ai_marketing' %}active{% endif %}">AI Marketing</a>
        <a href="{% url 'ai_agents' %}" class="{% if request.resolver_match.url_name == 'ai_agents' %}active{% endif %}">AI Agents</a>
        <a href="{% url 'home' %}#contact">Contact</a>
      </div>

      <!-- Action Group -->
      <div class="nav-actions">
        <a href="{% url 'home' %}#contact" class="btn-primary">Get a quote</a>
        
        <!-- Mobile Hamburger Toggle -->
        <button class="hamburger-toggle" aria-expanded="false" aria-controls="mobile-drawer" aria-label="Toggle navigation menu" type="button">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>
  </div>
</header>

<!-- Mobile Navigation Drawer -->
<div class="mobile-drawer" id="mobile-drawer" aria-hidden="true">
  <ul class="mobile-nav-list">
    <li><a href="{% url 'home' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"><span>Home</span> <span>→</span></a></li>
    <li><a href="{% url 'websites_apps' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'websites_apps' %}active{% endif %}"><span>1. Websites & Apps</span> <span>→</span></a></li>
    <li><a href="{% url 'erp' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'erp' %}active{% endif %}"><span>2. Odoo-Style ERP</span> <span>→</span></a></li>
    <li><a href="{% url 'ai_marketing' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'ai_marketing' %}active{% endif %}"><span>3. AI Marketing</span> <span>→</span></a></li>
    <li><a href="{% url 'ai_agents' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'ai_agents' %}active{% endif %}"><span>4. Domain AI Agents</span> <span>→</span></a></li>
    <li><a href="{% url 'home' %}#contact" class="mobile-nav-link"><span>Contact Us</span> <span>→</span></a></li>
  </ul>
  <div class="mobile-drawer-actions">
    <a href="tel:{{ STUDIO_PHONE }}" class="mobile-action-btn btn-mobile-call">
      <svg width="18" height="18" aria-hidden="true"><use href="#i-phone"/></svg>
      <span>Call Now ({{ STUDIO_PHONE }})</span>
    </a>
    <a href="{{ DEFAULT_WA_URL }}" target="_blank" rel="noopener noreferrer" class="mobile-action-btn btn-mobile-wa">
      <svg width="18" height="18" aria-hidden="true"><use href="#i-whatsapp"/></svg>
      <span>Chat on WhatsApp</span>
    </a>
  </div>
</div>
