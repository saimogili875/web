<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" style="background: #0B1D36;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132F54"/>
      <stop offset="100%" stop-color="#0A1A2F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E3A63" stroke-width="0.5" opacity="0.4"/>
  </pattern>
  <rect width="600" height="380" fill="url(#grid)"/>

  <!-- Device Window Frame -->
  <g filter="url(#shadow)">
    <rect x="40" y="35" width="520" height="310" rx="16" fill="url(#cardGrad)" stroke="#2A4A75" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <rect x="40" y="35" width="520" height="44" rx="16" fill="#0F2747"/>
    <rect x="40" y="65" width="520" height="14" fill="#0F2747"/>
    <line x1="40" y1="79" x2="560" y2="79" stroke="#1E3D6B" stroke-width="1"/>
    
    <!-- Window Dots -->
    <circle cx="66" cy="57" r="5" fill="#EF4444"/>
    <circle cx="84" cy="57" r="5" fill="#F59E0B"/>
    <circle cx="102" cy="57" r="5" fill="#10B981"/>
    
    <!-- Address Bar -->
    <rect x="130" y="46" width="340" height="22" rx="11" fill="#16325C" stroke="#244577" stroke-width="1"/>
    <text x="300" y="61" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">arkshar.studio/prototypes/dentist</text>

    <!-- Mobile view tag -->
    <rect x="485" y="48" width="60" height="18" rx="9" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
    <text x="515" y="61" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">LIVE DEMO</text>
  </g>

  <!-- Prototype Hero Inside Window -->
  <g transform="translate(65, 100)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1"/>
    <text x="10" y="15" fill="#0284C7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">DENTAL CLINIC</text>

    <!-- Main Title -->
    <text x="0" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">SmileCraft Dental</text>
    <text x="0" y="70" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Digital Checkup & Slot Booking</text>

    <!-- Feature Mockup List -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="280" height="34" rx="8" fill="#16325C" stroke="#24477A" stroke-width="1"/>
      <circle cx="18" cy="17" r="8" fill="#0284C7" fill-opacity="0.3"/>
      <text x="18" y="21" fill="#FFFFFF" font-size="10" text-anchor="middle">✓</text>
      <text x="36" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Teeth Cleaning & Polish</text>
    </g>

    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="280" height="34" rx="8" fill="#16325C" stroke="#24477A" stroke-width="1"/>
      <circle cx="18" cy="17" r="8" fill="#0284C7" fill-opacity="0.3"/>
      <text x="18" y="21" fill="#FFFFFF" font-size="10" text-anchor="middle">✓</text>
      <text x="36" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Root Canal Consultation</text>
    </g>

    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="280" height="34" rx="8" fill="#16325C" stroke="#24477A" stroke-width="1"/>
      <circle cx="18" cy="17" r="8" fill="#0284C7" fill-opacity="0.3"/>
      <text x="18" y="21" fill="#FFFFFF" font-size="10" text-anchor="middle">✓</text>
      <text x="36" y="21" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Orthodontic Braces Demo</text>
    </g>

    <!-- Side Visual / Phone Mockup -->
    <g transform="translate(315, 5)">
      <rect x="0" y="0" width="145" height="215" rx="18" fill="#0D1B2E" stroke="#2A4A75" stroke-width="2"/>
      <!-- Phone Notch / speaker -->
      <rect x="50" y="8" width="45" height="4" rx="2" fill="#2A4A75"/>
      <!-- Phone Inner Screen -->
      <rect x="8" y="20" width="129" height="185" rx="10" fill="#11294A"/>
      <!-- Icon Avatar inside Phone -->
      <circle cx="72" cy="55" r="24" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1.5"/>
      <text x="72" y="63" font-size="24" text-anchor="middle">🦷</text>
      <!-- Mini Phone Content -->
      <rect x="20" y="92" width="105" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.8"/>
      <rect x="30" y="106" width="85" height="6" rx="3" fill="#94A3B8" fill-opacity="0.6"/>
      <!-- Action button on phone -->
      <rect x="20" y="125" width="105" height="22" rx="6" fill="#F59E0B"/>
      <text x="72" y="139" fill="#0F2747" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Book on WhatsApp</text>
      <!-- Chat Bubble -->
      <rect x="20" y="156" width="95" height="18" rx="5" fill="#1E3A63"/>
      <text x="28" y="168" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="8">💬 Instant Confirmation</text>
    </g>
  </g>
</svg>